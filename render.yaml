# Déploiement de l'API Vault sur Render (formule gratuite) — voir docs/HEBERGEMENT.md.
# Les valeurs marquées « sync: false » sont des secrets : Render les demande à la création,
# elles ne sont jamais écrites ici.
services:
  - type: web
    name: vault-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    branch: master
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: firebase
      - key: STORAGE_MODE
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: SIGNED_URL_TTL_SECONDS
        value: "300"
      - key: WATERMARK_CERTIFICATES
        value: "true"
      - key: WATERMARK_PHOTOS
        value: "false"
      # PostgreSQL Neon (chaîne de connexion avec ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      # Backblaze B2 (compatible S3)
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
